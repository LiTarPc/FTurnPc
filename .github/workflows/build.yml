name: Windows CI

on:
  push:
    branches: [main, singbox, fix/singbox-freeturn-readiness]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Backend tests
        shell: pwsh
        run: |
          go test ./backend
          if ($LASTEXITCODE -ne 0) { throw "backend tests failed" }

      - name: Install Wails
        shell: pwsh
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0
          if ($LASTEXITCODE -ne 0) { throw "Wails CLI install failed" }

      - name: Build Windows UI and generate bindings
        shell: pwsh
        run: |
          npm --prefix frontend ci
          if ($LASTEXITCODE -ne 0) { throw "frontend dependency install failed" }
          wails build -platform windows/amd64
          if ($LASTEXITCODE -ne 0) { throw "Windows UI build failed" }
