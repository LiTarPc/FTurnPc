name: Windows Installer

on:
  push:
    branches:
      - fix/singbox-freeturn-readiness
  workflow_dispatch:
  workflow_call:
    inputs:
      release_tag:
        description: Stable version tag; empty publishes rolling preview
        required: false
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: fix-nsis-${{ github.ref }}
  cancel-in-progress: true

env:
  SINGBOX_VERSION: "1.14.0"
  FREETURN_CORE_COMMIT: "58d4f175d245c5773786e19ace454216c625f92f"
  PREVIEW_TAG: "singbox-fix-latest"
  RELEASE_TAG: ${{ inputs.release_tag }}
  INSTALLER_NAME: ${{ inputs.release_tag && format('FTurnPc-{0}-windows-amd64-installer.exe', inputs.release_tag) || 'FTurnPc-singbox-fix-amd64-installer.exe' }}

jobs:
  windows-nsis:
    name: Windows x64 NSIS
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate stable release
        if: inputs.release_tag != ''
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$') { throw "Stable release requires a vMAJOR.MINOR.PATCH tag" }
          $version = (Get-Content wails.json -Raw | ConvertFrom-Json).info.productVersion
          if ($env:RELEASE_TAG -ne "v$version") { throw "Release tag does not match wails.json: $version" }
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) { throw "Stable release commit must be on main" }
          if (-not (Test-Path "docs/releases/$env:RELEASE_TAG.md")) { throw "Release notes are missing" }

      - name: Checkout FreeTurn v4.1.3 core
        uses: actions/checkout@v4
        with:
          repository: LiTarPc/fturn-core
          ref: ${{ env.FREETURN_CORE_COMMIT }}
          path: fturn-core

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI
        shell: pwsh
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0

      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build FreeTurn v4.1.3 client
        shell: pwsh
        working-directory: fturn-core
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path "../build/bin" | Out-Null
          go test ./internal/provider/vk/internal/vkauth
          if ($LASTEXITCODE -ne 0) { throw "FreeTurn auth tests failed" }
          go test ./internal/transport/turndial
          if ($LASTEXITCODE -ne 0) { throw "FreeTurn TURN tests failed" }
          go build -trimpath -ldflags "-s -w -checklinkname=0 -X main.version=4.1.3" -o "../build/bin/client-windows-amd64.exe" ./cmd/client
          if ($LASTEXITCODE -ne 0) { throw "FreeTurn client build failed" }
          $reportedVersion = & "../build/bin/client-windows-amd64.exe" -version
          if ($LASTEXITCODE -ne 0 -or $reportedVersion -ne "v4.1.3") { throw "Unexpected FreeTurn version: $reportedVersion" }
          $file = Get-Item "../build/bin/client-windows-amd64.exe"
          if ($file.Length -lt 1MB) { throw "Built FreeTurn client is unexpectedly small: $($file.Length) bytes" }
          Write-Host "FreeTurn client: $($file.Length) bytes"

      - name: Download sing-box
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = $env:SINGBOX_VERSION
          $archive = Join-Path $env:RUNNER_TEMP "sing-box-$version-windows-amd64.zip"
          $url = "https://github.com/SagerNet/sing-box/releases/download/v$version/sing-box-$version-windows-amd64.zip"
          curl.exe -fL --retry 3 --retry-delay 2 $url -o $archive
          if ($LASTEXITCODE -ne 0) { throw "sing-box download failed with exit code $LASTEXITCODE" }
          Expand-Archive -Path $archive -DestinationPath . -Force
          $exe = "sing-box-$version-windows-amd64/sing-box.exe"
          if (-not (Test-Path $exe)) { throw "sing-box.exe not found after extraction: $exe" }
          & $exe version
          if ($LASTEXITCODE -ne 0) { throw "sing-box version check failed" }

      - name: Run backend tests
        shell: pwsh
        run: |
          go test ./backend
          if ($LASTEXITCODE -ne 0) { throw "backend tests failed" }
          $env:SING_BOX_BIN = (Resolve-Path "sing-box-$env:SINGBOX_VERSION-windows-amd64/sing-box.exe").Path
          $env:SING_BOX_EXPECTED_VERSION = $env:SINGBOX_VERSION
          go test -tags=integration ./backend -run TestSingBoxSchema -count=1
          if ($LASTEXITCODE -ne 0) { throw "sing-box schema tests failed" }

      - name: Build Wails NSIS installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          wails build -platform windows/amd64 -nsis
          if ($LASTEXITCODE -ne 0) { throw "wails NSIS build failed with exit code $LASTEXITCODE" }
          Get-ChildItem "build/bin" | Format-Table Name,Length,LastWriteTime

      - name: Prepare installer artifact
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installer = Get-ChildItem "build/bin" -Filter "*-installer.exe" -File |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $installer) { throw "NSIS installer was not produced in build/bin" }

          New-Item -ItemType Directory -Force -Path "dist" | Out-Null
          $targetName = $env:INSTALLER_NAME
          $target = Join-Path "dist" $targetName
          Copy-Item $installer.FullName $target

          $hash = (Get-FileHash $target -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $targetName" | Set-Content -Path "$target.sha256.txt" -Encoding ascii
          Write-Host "Installer: $target"
          Write-Host "SHA256:   $hash"

      - name: Upload NSIS installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: FTurnPc-windows-nsis-${{ github.run_number }}
          path: |
            dist/${{ env.INSTALLER_NAME }}
            dist/${{ env.INSTALLER_NAME }}.sha256.txt
          if-no-files-found: error
          retention-days: 14

      - name: Move rolling prerelease tag
        if: inputs.release_tag == ''
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f $env:PREVIEW_TAG $env:GITHUB_SHA
          git push origin "refs/tags/$env:PREVIEW_TAG" --force

      - name: Publish rolling prerelease
        if: inputs.release_tag == ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.PREVIEW_TAG }}
          name: "Sing-box Fix Preview"
          prerelease: true
          make_latest: false
          overwrite_files: true
          fail_on_unmatched_files: true
          body: |
            Автоматическая preview-сборка ветки `fix/singbox-freeturn-readiness`.

            - Commit: `${{ github.sha }}`
            - sing-box: `${{ env.SINGBOX_VERSION }}`
            - FreeTurn core: `${{ env.FREETURN_CORE_COMMIT }}`
            - Windows: x64
            - Installer: NSIS

            Этот prerelease автоматически обновляется при каждом push в fix-ветку.
          files: |
            dist/${{ env.INSTALLER_NAME }}
            dist/${{ env.INSTALLER_NAME }}.sha256.txt

      - name: Publish stable Windows release
        if: inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: "FTurnPc ${{ inputs.release_tag }} — Windows sing-box"
          prerelease: false
          make_latest: true
          overwrite_files: true
          fail_on_unmatched_files: true
          body_path: docs/releases/${{ inputs.release_tag }}.md
          files: |
            dist/${{ env.INSTALLER_NAME }}
            dist/${{ env.INSTALLER_NAME }}.sha256.txt
