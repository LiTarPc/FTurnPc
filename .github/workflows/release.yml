name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-nsis:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Download latest fturn-core
        run: |
          mkdir -p build/bin
          curl -s -L -o build/bin/client-windows-amd64.exe https://github.com/LiTarPc/fturn-core/releases/latest/download/client-windows-amd64.exe
        shell: bash

      - name: Install NSIS
        run: choco install nsis -y

      - name: Build Wails NSIS Installer
        run: wails build -platform windows/amd64 -nsis

      - name: Upload NSIS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FTurnPc-windows-installer
          path: build/bin/*-installer.exe
          if-no-files-found: error

  release:
    needs: build-nsis
    runs-on: ubuntu-latest
    steps:
      - name: Download Linux artifact
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: build.yml
          name: FTrunPc
          path: dist

      - name: Download Windows artifact
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: build.yml
          name: FTrunPc-windows-amd64
          path: dist

      - name: Download NSIS artifact
        uses: actions/download-artifact@v4
        with:
          name: FTurnPc-windows-installer
          path: dist

      - name: List dist contents
        run: find dist/ -maxdepth 3 -ls

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/FTrunPc
            dist/FTrunPc.exe
            dist/*-installer.exe
