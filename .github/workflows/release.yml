name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Download latest fturn-core
        run: |
          mkdir -p build/bin
          curl -s -L -o build/bin/client-windows-amd64.exe https://github.com/LiTarPc/fturn-core/releases/latest/download/client-windows-amd64.exe
        shell: bash

      - name: Install NSIS
        run: |
          choco install nsis -y
          echo "C:\Program Files (x86)\NSIS" >> $env:GITHUB_PATH

      - name: Build Wails NSIS Installer
        run: |
          wails build -platform windows/amd64 -nsis
          dir build\bin

      - name: Download Linux artifact
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: build.yml
          name: FTrunPc
          path: dist

      - name: Download Windows artifact
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: build.yml
          name: FTrunPc-windows-amd64
          path: dist

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/FTrunPc
            dist/FTrunPc.exe
            build/bin/*-installer.exe
